# Render the Quarto site and deploy it to GitHub Pages.
#
# One-time setup in the repo: Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions". No gh-pages branch is used; the rendered output
# is uploaded as a Pages artifact and deployed from there.
#
# No Python or R is installed. Posts should freeze computational output
# (freeze: true) and commit _freeze/ so the runner never executes code cells.

name: Publish Quarto site

on:
  push:
    branches: [main]
    paths-ignore:
      - ".claude/**"
      - "CLAUDE.md"
      - ".gitignore"
      - "design.md"
      - "design.tokens.json"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Render site
        run: quarto render
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
